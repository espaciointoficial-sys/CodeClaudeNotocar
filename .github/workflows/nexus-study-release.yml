name: Nexus Study - Release

# Se dispara al subir una etiqueta de versión (por ejemplo v0.2.0).
# Compila Nexus Study para Windows y publica el instalador + los metadatos
# de actualización (latest.yml) como assets de una GitHub Release, para que
# electron-updater pueda detectarlos desde las instalaciones existentes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # necesario para que electron-builder pueda crear la Release y subir assets

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nexus-study
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexus-study/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobaciones (typecheck, lint, tests)
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Crear la Release en GitHub si no existe todavía
        # electron-builder sube el instalador y su .blockmap en paralelo; si la Release
        # de esta etiqueta no existe aún, cada subida intenta crearla por su cuenta y
        # aparecen dos Releases duplicadas. Creándola aquí primero (vacía, en borrador),
        # electron-builder la encuentra ya existente y solo le añade los archivos.
        shell: bash
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
              --title "Nexus Study ${{ github.ref_name }}" \
              --notes "Publicado automáticamente por GitHub Actions." \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar en GitHub Releases
        run: npm run release
        env:
          # Token automático de Actions: como la release se publica en este mismo
          # repositorio, no hace falta crear ningún secreto adicional.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
